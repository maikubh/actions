name: 'Slack Release Notify'
description: 'Posts a grouped Slack message when commits land on main, categorized by conventional commit type'
author: 'BlairHealth'

inputs:
  webhook:
    description: 'Slack incoming webhook URL'
    required: true
  github-token:
    description: 'GitHub token for API access'
    required: true
  before-sha:
    description: 'The commit SHA before the push (github.event.before)'
    required: true
  app-name:
    description: 'Human-readable app name shown in the Slack message (e.g. "Web App", "Backend", "Mobile")'
    required: false
    default: ''

runs:
  using: 'node20'
  main: 'dist/index.js'
